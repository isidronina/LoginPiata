<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Isso define o idioma e os acentos da página -->
  <meta charset="UTF-8">
  <!-- Isso faz a página se ajustar ao tamanho da tela do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título que aparece na aba do navegador -->
  <title>Login - Painel Administrativo</title>

  <!-- Isso liga o arquivo de estilos (cores, layout, fontes) -->
  <link rel="stylesheet" href="Login.css">
</head>
<body>

  <!-- Layout principal: imagem na esquerda e formulário na direita -->
  <main class="login_grid">

    <!-- Imagem lateral (some em telas pequenas) -->
    <div class="login_imagem">
      <img src="assets/SalaBranca.png" alt="Ambiente com móveis sob medida em madeira">
    </div>

    <!-- Painel onde fica o formulário -->
    <section class="login_painel">
      <div class="login_caixa">

        <!--
          NAVEGAÇÃO (para quem for ligar as páginas depois):
          Este link leva o usuário de volta à página inicial do site.
          Se o nome da página inicial for outro, é só trocar o "index.html" abaixo.
        -->
        <a href="index.html" class="botao_voltar">‹ Voltar ao site</a>

        <!-- Título e subtítulo da página -->
        <h1 class="titulo_pagina">Bem-vindo de volta!</h1>
        <p class="descricao_pagina">Entre com seus dados para acessar sua conta.</p>

        <!-- Formulário de login (o Login.js controla o envio dele) -->
        <form class="formulario" id="login-form" novalidate>

          <!-- Campo de e-mail -->
          <div class="campo_formulario">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="console.log220@gmail.com" autocomplete="email" required>
            <!-- Aqui aparece o erro do e-mail (o JS mostra e esconde) -->
            <small class="mensagem_erro" data-error="email" hidden></small>
          </div>

          <!-- Campo de senha -->
          <div class="campo_formulario">
            <div class="linha_campo_topo">
              <label for="senha">Senha</label>

              <!--
                NAVEGAÇÃO: leva para a página de recuperar senha.
                Se o nome da página for outro, troque o "esqueci-senha.html".
              -->
              <a href="esqueci-senha.html" class="link_destaque">Esqueci minha senha</a>
            </div>

            <div class="campo_senha">
              <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
              <!-- Botão que mostra ou esconde a senha (o JS troca o texto Mostrar/Ocultar) -->
              <button type="button" class="botao_visibilidade" data-action="toggle-login-password">Mostrar</button>
            </div>
            <!-- Aqui aparece o erro da senha (o JS mostra e esconde) -->
            <small class="mensagem_erro" data-error="senha" hidden></small>
          </div>

          <!-- Botão que envia o formulário e faz o login -->
          <button type="submit" class="botao_envio">Entrar na minha conta</button>

          <!-- Aqui aparece um erro geral do formulário (ex.: falha ao salvar a sessão) -->
          <small class="mensagem_erro" role="alert" data-error="form" hidden></small>

          <p class="texto_cadastro">
            <!--
              NAVEGAÇÃO: leva para a página de cadastro.
              Se o nome da página for outro, troque o "cadastro.html".
            -->
            Não tem uma conta? <a href="cadastro.html" class="link_destaque">Cadastre-se</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <!--
    Isso liga o arquivo de JavaScript (mostrar senha, validar login e abrir o dashboard).
    NAVEGAÇÃO: a página aberta após o login correta é definida no final do Login.js
    (linha com window.location.href = 'dashboard.html').
  -->
  <script src="Login.js"></script>
</body>
</html>
